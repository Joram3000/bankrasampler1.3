; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ─── Shared base config ───────────────────────────────────────────────────────
[base]
platform              = espressif32
board                 = esp32dev
framework             = arduino
monitor_speed         = 115200
board_build.partitions = partitions.csv
build_src_filter      = +<*> -<transfer_app/>
lib_deps =
    olikraus/U8g2@^2.30.3

; ─── Normal (no Bluetooth) ────────────────────────────────────────────────────
; Full delay buffer (300 ms @ 44100 Hz = ~26 KB), no BT overhead.
[env:esp32dev]
extends     = base

; ─── Bluetooth mode ───────────────────────────────────────────────────────────
; With bt_enabled=1 (settings.txt) there is no delay at all: the A2DP stack
; needs the heap. With bt_enabled=0 the delay is sized as in the normal build.
; Build flag -DBLUETOOTH_MODE gates all BT code (src/audio/ and a few #ifdefs).
; Note: CONFIG_BT_* flags komen uit de ingebakken Arduino ESP32 sdkconfig —
; die NIET hier herhalen want dat geeft redefinition conflicts.
[env:esp32dev-bt]
extends     = base
build_flags =
    -DBLUETOOTH_MODE
lib_deps    =
    olikraus/U8g2@^2.30.3
    https://github.com/pschatzmann/ESP32-A2DP

; ─── WiFi transfer app ────────────────────────────────────────────────────────
; Separate firmware in the "transfer" partition (partitions.csv): SD card over
; WiFi at http://bankra.local, started from the settings menu ("WiFi upload").
; Not part of the sampler builds because linking WiFi costs ~20 KB of static
; RAM that the BT stack can't spare. Flash once (and after changing it) with
;   pio run -e transfer -t upload
; Uploading either firmware makes the sampler the boot app again.
[env:transfer]
extends                    = base
build_src_filter           = +<transfer_app/>
board_upload.offset_address = 0x280000
board_build.app_partition_name = transfer
